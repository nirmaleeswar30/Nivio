name: nivio
description: "Core logic, models, scrapers, state management, and UI components for Nivio."
publish_to: 'none'
version: 2.2.3

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1

  # Networking
  dio: ^5.7.0
  http: ^1.6.0
  supabase_flutter: ^2.8.0

  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.3.3
  path_provider: ^2.1.5

  # Firebase
  firebase_core: ^4.11.0
  firebase_auth: ^6.5.4
  cloud_firestore: ^6.6.0
  google_sign_in: ^7.2.0

  # Video Player & Media
  youtube_player_flutter: ^10.0.1
  flutter_inappwebview: ^6.2.0-beta.3
  flutter_inappwebview_linux: any
  media_kit: ^1.1.10
  media_kit_video: ^1.2.4
  media_kit_libs_video: ^1.0.7
  ffmpeg_kit_flutter_new: ^4.2.1
  wakelock_plus: ^1.2.8

  # Embedded rqbit BitTorrent streaming engine (P2P anime, Hayase-style)
  rqbit_ffi:
    path: ../rqbit_ffi

  # UI, Images & Animations
  cached_network_image: ^3.4.1
  go_router: ^17.3.0
  phosphoricons_flutter: ^1.0.0
  flutter_markdown_plus: ^1.0.11
  flutter_native_splash: ^2.4.2
  silky_scroll: ^2.6.4
  animations: ^2.2.0

  # Utilities
  intl: ^0.20.2
  pointycastle: ^4.0.0  # AES-GCM for VidRock source decryption
  freezed_annotation: ^2.4.4
  url_launcher: ^6.3.1
  package_info_plus: ^10.2.0
  connectivity_plus: ^7.2.0
  flutter_dotenv: ^6.0.0
  permission_handler: ^12.0.3
  flutter_cache_manager: any
  file_picker: 12.0.0-beta.7  # pinned: app code targets this API
  share_plus: ^13.2.0
  shorebird_code_push: ^2.0.5
  window_manager: ^0.3.9
  workmanager: ^0.9.0
  flutter_local_notifications: ^22.0.1
  device_screen_brightness: ^0.2.1
  flutter_volume_controller: ^2.0.1
  simple_pip_mode: ^1.1.0
  discord_rich_presence: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true

dependency_overrides:
  freezed_annotation: ^3.1.0
