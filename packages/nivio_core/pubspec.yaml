name: nivio
description: "Core logic, models, scrapers, state management, and UI components for Nivio."
publish_to: 'none'
version: 2.2.8

environment:
  sdk: ^3.14.0

dependencies:
  ffi: ^2.2.0
  win32: ^6.3.0
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^3.5.0

  # Networking
  dio: ^5.7.0
  http: ^1.6.0
  html: ^0.15.6
  cronet_http: ^1.9.0
  supabase_flutter: ^2.8.0

  # Local Storage
  hive_ce: ^2.24.0
  hive_ce_flutter: ^2.6.0
  shared_preferences: ^2.3.3
  path_provider: ^2.1.5

  # Firebase
  firebase_core: ^5.2.0
  firebase_auth: ^7.1.0
  cloud_firestore: ^7.2.0
  google_sign_in: ^7.2.0

  # Video Player & Media
  media_kit: ^1.1.10
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.7
  ffmpeg_kit_flutter_new: ^5.0.0
  wakelock_plus: ^1.2.8

  # Embedded rqbit BitTorrent streaming engine (P2P anime streaming)
  rqbit_ffi:
    path: ../rqbit_ffi

  # UI, Images & Animations
  cached_network_image: ^4.0.7
  go_router: ^18.1.4
  phosphoricons_flutter: ^1.0.0
  flutter_markdown_plus: ^1.0.11
  flutter_native_splash: ^2.4.2
  silky_scroll: ^2.6.4
  animations: ^3.0.0
  google_fonts: ^9.0.0

  # Utilities
  intl: ^0.20.2
  pointycastle: ^4.0.0  # AES-GCM for VidRock source decryption
  freezed_annotation: ^3.1.0
  url_launcher: ^6.3.1
  package_info_plus: ^10.2.0
  connectivity_plus: ^7.2.0
  flutter_dotenv: ^6.0.0
  permission_handler: ^13.0.2
  flutter_cache_manager: any
  file_picker: ^13.4.1
  share_plus: ^13.2.0
  shorebird_code_push: ^2.0.5
  window_manager: ^0.7.1
  workmanager: ^0.10.10
  flutter_local_notifications: ^23.0.4
  device_screen_brightness: ^2.0.0
  flutter_volume_controller: ^2.0.1
  simple_pip_mode: ^2.0.0
  discord_rich_presence: ^1.1.1
  # Mobile Discord Rich Presence (OAuth2 over the Gateway)
  flutter_secure_storage: ^11.2.0
  app_links: any
  # MPRIS (Linux media keys / Bluetooth headset controls)
  dbus: ^0.8.1
  crypto: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.17.0
  freezed: ^4.0.0
  json_serializable: ^6.15.0
  hive_ce_generator: ^1.12.1

flutter:
  uses-material-design: true

  # Liquid glass nav lens + rim (lib/core/liquid_glass); the app packages load
  # them as packages/nivio/shaders/*.
  shaders:
    - shaders/glass_lens.frag
    - shaders/glass_highlight.frag

