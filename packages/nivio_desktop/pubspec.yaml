name: nivio_desktop
description: "Desktop target application for Nivio (Linux, Windows, macOS)."
publish_to: 'none'
version: 2.2.6+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter

  nivio:
    path: ../nivio_core

  # Embedded rqbit torrent streaming engine (P2P anime)
  rqbit_ffi:
    path: ../rqbit_ffi

  # Desktop-specific dependencies
  rhttp: ^0.18.0
  window_manager: ^0.3.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/nivio-preload.mpeg
    - shorebird.yaml
    - assets/fonts/satoshi/
    - .env

  fonts:
    - family: Satoshi
      fonts:
        - asset: assets/fonts/satoshi/Satoshi-Light.otf
          weight: 300
        - asset: assets/fonts/satoshi/Satoshi-LightItalic.otf
          weight: 300
          style: italic
        - asset: assets/fonts/satoshi/Satoshi-Regular.otf
          weight: 400
        - asset: assets/fonts/satoshi/Satoshi-Medium.otf
          weight: 500
        - asset: assets/fonts/satoshi/Satoshi-MediumItalic.otf
          weight: 500
          style: italic
        - asset: assets/fonts/satoshi/Satoshi-Bold.otf
          weight: 700
        - asset: assets/fonts/satoshi/Satoshi-BoldItalic.otf
          weight: 700
          style: italic
        - asset: assets/fonts/satoshi/Satoshi-Black.otf
          weight: 900
        - asset: assets/fonts/satoshi/Satoshi-Italic.otf
          style: italic
        - asset: assets/fonts/satoshi/Satoshi-BlackItalic.otf
          weight: 900
          style: italic

flutter_launcher_icons:
  windows:
    generate: true
    image_path: "../../assets/images/nivio.png"
    icon_size: 256
  macos:
    generate: true
    image_path: "../../assets/images/nivio.png"

dependency_overrides:
  flutter_inappwebview_linux:
    git:
      url: https://github.com/nirmaleeswar30/flutter_inappwebview.git
      path: flutter_inappwebview_linux
  freezed_annotation: ^3.1.0
  firebase_core:
    path: ../../packages/stubs/firebase_core
  firebase_auth:
    path: ../../packages/stubs/firebase_auth
  cloud_firestore:
    path: ../../packages/stubs/cloud_firestore
  google_sign_in:
    path: ../../packages/stubs/google_sign_in
