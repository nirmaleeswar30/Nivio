name: nivio_curl
description: >-
  package:http client for iOS backed by libcurl-impersonate (lexiforest, MIT),
  so requests carry a real Chrome TLS / HTTP2 fingerprint like Cronet does on
  Android. Ships CurlImpersonate.framework (ios/build_curl_framework.sh) and the
  Mozilla CA bundle (BoringSSL does not use the iOS keychain).
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.10.0
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.1.0
  http: ^1.6.0

flutter:
  plugin:
    platforms:
      ios:
        ffiPlugin: true
  assets:
    - assets/cacert.pem
